name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - packages/core-py
          - apps/api
          - services/data-solana
          - services/data-binance
          - services/engine-solana-discovery
          - services/engine-solana-momentum
          - services/engine-solana-migration
          - services/engine-binance-futures
          - services/decision-engine
          - services/ml
          - services/paper-trading
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yonixalpha
          POSTGRES_PASSWORD: yonixalpha_test_pw
          POSTGRES_DB: yonixalpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yonixalpha -d yonixalpha_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: |
          if [ "${{ matrix.project }}" = "packages/core-py" ]; then
            ruff check yonixalpha_core tests
          else
            ruff check app tests
          fi

      # Audits this project's actual installed dependency set (from the
      # `pip install` above, run in this same working-directory so the
      # `-e ../../packages/core-py` line in every non-core-py requirements.txt
      # resolves correctly) rather than parsing requirements.txt in
      # isolation, which would miss what versions transitive deps actually
      # resolve to. `python -m pip install --upgrade pip` first so pip's own
      # version doesn't itself show up as a finding. PYSEC-2026-1845 (pytest,
      # fixed only in pytest 9.x) is ignored deliberately — see
      # docs/SECURITY.md section 10: it's a local /tmp-race issue in a
      # dev/test-only tool that never runs against untrusted input or in
      # production, and bumping to pytest 9 + pytest-asyncio 1.x across all
      # 11 projects is a real-risk change not worth making for a
      # near-zero-real-risk finding.
      - name: Dependency audit (pip-audit)
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install -q --upgrade pip setuptools
          pip install -q pip-audit
          pip-audit --desc off --ignore-vuln PYSEC-2026-1845

      # Every other project's conftest.py connects with real credentials
      # (postgresql+asyncpg://yonixalpha:yonixalpha_test_pw@localhost:5432/yonixalpha_test,
      # redis://localhost:6379/15) as its own os.environ.setdefault(...)
      # default — matched exactly by the service containers above — so no
      # DATABASE_URL/REDIS_URL overrides are needed for the Test step
      # below. Alembic is different: it reads Settings.database_url
      # directly (migrations/env.py), which without DATABASE_URL set
      # falls back to POSTGRES_HOST's own default of "postgres" — a
      # hostname that only resolves inside a Docker Compose network, not
      # on this bare runner where the service container is reachable via
      # localhost instead. Run before the Test step: Alembic needs a
      # schema created via real migrations (not SQLAlchemy's
      # Base.metadata.create_all, which is all pytest's own fixtures
      # use), and running it after pytest would collide with whatever
      # tables that left behind.
      - name: Alembic migration check
        if: matrix.project == 'apps/api'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://yonixalpha:yonixalpha_test_pw@localhost:5432/yonixalpha_test
          JWT_SECRET: ci-only-secret-not-used-for-anything-real
          ADMIN_PASSWORD_HASH: unused-in-this-step
        run: |
          alembic upgrade head
          alembic check

      - name: Test
        working-directory: ${{ matrix.project }}
        run: pytest tests -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `postcss`/`next` are the one known, deferred finding as of Phase 10
      # (only fix is a major next.js bump — see docs/SECURITY.md section 10
      # for why that's not applied blind here) — explicitly allow-listed so
      # this step still fails on anything *new*, rather than raising
      # --audit-level and silently missing a future high/critical finding
      # in some other dependency.
      - name: Dependency audit (npm audit)
        run: |
          npm audit --json > audit.json || true
          node -e '
            const r = require("./audit.json");
            const allowed = new Set(["next", "postcss"]);
            const unexpected = Object.keys(r.vulnerabilities || {}).filter(n => !allowed.has(n));
            if (unexpected.length > 0) {
              console.error("Unexpected new vulnerabilities:", unexpected);
              process.exit(1);
            }
            console.log("Only known, deferred findings present:", Object.keys(r.vulnerabilities || {}));
          '

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      - name: Scan full history for committed secrets
        run: gitleaks detect --source . --verbose
