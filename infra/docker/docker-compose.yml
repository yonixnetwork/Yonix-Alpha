# Base service definitions shared by dev and prod. Run with an override:
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.dev.yml up
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.prod.yml up -d
# Both expect a .env file in the repo root (see .env.example / docs/ENVIRONMENT.md).
#
# Every service loads the same env_file (repo-root .env) rather than relying
# on docker compose's ${VAR} substitution, which resolves against the
# *compose file's* directory by default, not the repo root — mixing the two
# silently drops values like POSTGRES_PASSWORD. Where a value is needed
# inside a command/healthcheck, it's read from the container's own shell
# environment (populated by env_file) instead of compose-file substitution.

name: yonixalpha

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [yonixalpha]

  redis:
    image: redis:7-alpine
    env_file:
      - ../../.env
    entrypoint: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks: [yonixalpha]

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [yonixalpha]

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - api
    networks: [yonixalpha]

networks:
  yonixalpha:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
