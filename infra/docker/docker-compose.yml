# Base service definitions shared by dev and prod. Run with an override:
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.dev.yml up
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.prod.yml up -d
# Both expect a .env file in the repo root (see .env.example / docs/DEPLOYMENT.md).
#
# Every service loads the same env_file (repo-root .env) rather than relying
# on docker compose's ${VAR} substitution, which resolves against the
# *compose file's* directory by default, not the repo root — mixing the two
# silently drops values like POSTGRES_PASSWORD. Where a value is needed
# inside a command/healthcheck, it's read from the container's own shell
# environment (populated by env_file) instead of compose-file substitution.

name: yonixalpha

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [yonixalpha]

  redis:
    image: redis:7-alpine
    env_file:
      - ../../.env
    # --appendonly yes is a safety requirement, not a tuning choice. Redis
    # holds the kill switch (yonixalpha_core/kill_switch.py), the emergency
    # stop the risk engine checks first and unconditionally. With only the
    # default RDB snapshots, a single key change is governed by `save 3600
    # 1` — so on a quiet system, engaging the kill switch could sit
    # unpersisted for up to an hour, and a crash in that window would bring
    # Redis back with the switch DISENGAGED. That fails open: trading
    # silently re-arms. AOF (fsync every second by default) reduces that
    # window from an hour to about a second. Measured during the audit:
    # appendonly was `no` and save was `3600 1 300 100 60 10000`.
    #
    # maxmemory + volatile-lru bounds the pump.fun stream buffers on a small
    # server. volatile-lru only ever evicts keys that carry a TTL — every
    # stream key does (yonixalpha_core/solana/pump_stream.py), the kill
    # switch keys never do — so memory pressure can drop old trade history
    # but can never silently disengage the kill switch.
    entrypoint: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks: [yonixalpha]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [yonixalpha]

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - ../../.env
    depends_on:
      - api
    networks: [yonixalpha]

  data-solana:
    build:
      context: ../..
      dockerfile: services/data-solana/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [yonixalpha]

  data-binance:
    build:
      context: ../..
      dockerfile: services/data-binance/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [yonixalpha]

  engine-solana-discovery:
    build:
      context: ../..
      dockerfile: services/engine-solana-discovery/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [yonixalpha]

  engine-solana-momentum:
    # Superseded by the pump.fun stream funnel in engine-solana-discovery
    # (both subscribed to the whole SPL Token program). Kept buildable;
    # start with `--profile legacy` only if needed.
    profiles: ["legacy"]
    build:
      context: ../..
      dockerfile: services/engine-solana-momentum/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [yonixalpha]

  engine-solana-migration:
    # Superseded by the pump.fun stream funnel in engine-solana-discovery
    # (both subscribed to the whole SPL Token program). Kept buildable;
    # start with `--profile legacy` only if needed.
    profiles: ["legacy"]
    build:
      context: ../..
      dockerfile: services/engine-solana-migration/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [yonixalpha]

  decision-engine:
    build:
      context: ../..
      dockerfile: services/decision-engine/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [yonixalpha]

  ml:
    build:
      context: ../..
      dockerfile: services/ml/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [yonixalpha]

  paper-trading:
    build:
      context: ../..
      dockerfile: services/paper-trading/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [yonixalpha]

  engine-binance-futures:
    build:
      context: ../..
      dockerfile: services/engine-binance-futures/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [yonixalpha]

  # LIVE execution for the futures/FX strategies (Binance, Bybit,
  # Hyperliquid, MT5 bridge). With the environment locks closed it only
  # reports "disabled" and cancels any pending futures order.
  execution-futures:
    build:
      context: ../..
      dockerfile: services/execution-futures/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [yonixalpha]

networks:
  yonixalpha:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
