# Production override: no host-exposed DB/Redis ports, restart policies,
# and the reverse proxy fronting the api/web services. Deployed from
# /opt/yonixalpha on the DigitalOcean droplet — see docs/DEPLOYMENT.md.

services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      - APP_ENV=production
    # Dashboard key updates: the api writes one request file here; the host
    # helper (scripts/install-env-updater.sh) applies it to .env. Until the
    # helper is installed the directory is root-owned and updates are refused.
    volumes:
      - ../../runtime/env-requests:/app/runtime/env-requests

  web:
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  data-solana:
    restart: unless-stopped

  data-evm:
    restart: unless-stopped

  copy-engine:
    restart: unless-stopped

  engine-solana-discovery:
    restart: unless-stopped

  engine-solana-momentum:
    restart: unless-stopped

  engine-solana-migration:
    restart: unless-stopped

  decision-engine:
    restart: unless-stopped

  ml:
    restart: unless-stopped

  paper-trading:
    restart: unless-stopped

  reverse-proxy:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
      - web
    volumes:
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    networks: [yonixalpha]

  # Renews whatever certificate already exists at certbot_conf every 12h —
  # a no-op until the operator runs the one-time `certbot certonly` bootstrap
  # command in docs/DEPLOYMENT.md, since `renew` only ever touches a
  # certificate that's already been issued (never the temporary self-signed
  # one reverse-proxy's own entrypoint generates — certbot doesn't recognize
  # that as something it manages). nginx isn't told to reload automatically
  # here since a renewal only actually changes anything roughly every ~60
  # days; the same manual `docker compose restart reverse-proxy` documented
  # for the initial bootstrap applies.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'
    networks: [yonixalpha]

volumes:
  certbot_www:
  certbot_conf:
