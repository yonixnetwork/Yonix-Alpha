# Local development override: hot reload, source bind mounts, and direct
# port exposure for debugging (Postgres/Redis are reachable from the host —
# never do this in prod, see docker-compose.prod.yml).
#
# Every backend service bind-mounts BOTH its own app/ directory AND
# packages/core-py to the paths the image's `pip install -e` points at, so
# editing shared code hot-reloads across every service without a rebuild.

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    build:
      target: base
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../../apps/api:/app
      - ../../packages/core-py:/packages/core-py
    ports:
      - "8000:8000"

  web:
    build:
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"

  data-solana:
    volumes:
      - ../../services/data-solana/app:/app/app
      - ../../packages/core-py:/packages/core-py

  data-binance:
    volumes:
      - ../../services/data-binance/app:/app/app
      - ../../packages/core-py:/packages/core-py

  engine-solana-discovery:
    volumes:
      - ../../services/engine-solana-discovery/app:/app/app
      - ../../packages/core-py:/packages/core-py

  engine-solana-momentum:
    volumes:
      - ../../services/engine-solana-momentum/app:/app/app
      - ../../packages/core-py:/packages/core-py

  engine-solana-migration:
    volumes:
      - ../../services/engine-solana-migration/app:/app/app
      - ../../packages/core-py:/packages/core-py

  engine-binance-futures:
    volumes:
      - ../../services/engine-binance-futures/app:/app/app
      - ../../packages/core-py:/packages/core-py
