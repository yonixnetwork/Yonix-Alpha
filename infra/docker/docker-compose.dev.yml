# Local development override: hot reload, source bind mounts, and direct
# port exposure for debugging (Postgres/Redis are reachable from the host —
# never do this in prod, see docker-compose.prod.yml).

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    build:
      target: base
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../../apps/api:/app
    ports:
      - "8000:8000"

  web:
    build:
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
