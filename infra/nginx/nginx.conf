events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    upstream api_upstream {
        server api:8000;
    }

    upstream web_upstream {
        server web:3000;
    }

    # ACME HTTP-01 challenge + redirect everything else to HTTPS. Point
    # PUBLIC_DOMAIN's DNS at this server before relying on the redirect —
    # see docs/DEPLOYMENT.md.
    server {
        listen 80;
        server_name yonixalpha.com www.yonixalpha.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # The cert/key paths below always exist by the time nginx reads this
    # file — docker-entrypoint.sh writes a temporary self-signed pair here
    # on first boot if certbot hasn't run yet (see docs/DEPLOYMENT.md's TLS
    # bootstrap section), so this block is live from the very first
    # `docker compose up`, not something enabled later by hand.
    server {
        listen 443 ssl;
        server_name yonixalpha.com www.yonixalpha.com;

        ssl_certificate     /etc/letsencrypt/live/yonixalpha.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yonixalpha.com/privkey.pem;

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
