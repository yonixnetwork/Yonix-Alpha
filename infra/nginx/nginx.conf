events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    # Defense-in-depth in front of the app-level lockout in
    # apps/api/app/api/routes/auth.py (5 failed attempts/15min locks the
    # *account*; this limits request rate per *IP*, independent of whether
    # attempts succeed). 5r/m ~= one attempt every 12s sustained, burst=5
    # tolerates the login form retrying once or twice quickly on a typo.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    upstream api_upstream {
        server api:8000;
    }

    upstream web_upstream {
        server web:3000;
    }

    # ACME HTTP-01 challenge + redirect everything else to HTTPS. Point
    # PUBLIC_DOMAIN's DNS at this server before relying on the redirect —
    # see docs/DEPLOYMENT.md.
    server {
        listen 80;
        server_name yonixalpha.com www.yonixalpha.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # The cert/key paths below always exist by the time nginx reads this
    # file — docker-entrypoint.sh writes a temporary self-signed pair here
    # on first boot if certbot hasn't run yet (see docs/DEPLOYMENT.md's TLS
    # bootstrap section), so this block is live from the very first
    # `docker compose up`, not something enabled later by hand.
    server {
        listen 443 ssl;
        server_name yonixalpha.com www.yonixalpha.com;

        ssl_certificate     /etc/letsencrypt/live/yonixalpha.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yonixalpha.com/privkey.pem;

        # Sent on every response, HTTPS and errors included, so a
        # misconfigured upstream can't silently drop them. HSTS is safe to
        # set unconditionally here since port 80 only ever redirects to
        # https:// (see the ACME server block above) — there is no plain-HTTP
        # content on this domain to accidentally lock users out of.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # connect-src: 'self' plus this host's own wss:// for the dashboard's
        # realtime socket (/api/ws). CSP3 browsers already treat 'self' as
        # covering same-host wss, but older Safari does not. Scoped to $host,
        # never a bare wss:, so the page still cannot open sockets elsewhere.
        # frame-ancestors duplicates
        # X-Frame-Options for browsers that only honor CSP.
        #
        # script-src needed 'unsafe-inline' added here after a real
        # deployment (not this sandbox, which never runs a browser against
        # a built `next build` output) showed the page loading (curl/200)
        # but never becoming interactive: Next.js App Router's own RSC
        # hydration bootstrap emits several inline <script> blocks with no
        # nonce, which a bare script-src 'self' blocks outright (confirmed
        # via the browser's own console: "Executing inline script violates
        # ... script-src 'self'"). The stricter, correct fix is Next.js's
        # nonce-based CSP support (a per-request nonce set in middleware,
        # which Next then applies to its own inline scripts automatically)
        # rather than 'unsafe-inline' — not done here since it needs
        # accompanying changes in apps/web (a middleware.ts) that were out
        # of scope for unblocking a live deployment; tracked as follow-up.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Realtime event stream. Authenticated by the first message (the
        # access token), never by the URL, so tokens don't reach access logs.
        location = /api/ws {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
