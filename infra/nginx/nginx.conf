events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    # Defense-in-depth in front of the app-level lockout in
    # apps/api/app/api/routes/auth.py (5 failed attempts/15min locks the
    # *account*; this limits request rate per *IP*, independent of whether
    # attempts succeed). 5r/m ~= one attempt every 12s sustained, burst=5
    # tolerates the login form retrying once or twice quickly on a typo.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    upstream api_upstream {
        server api:8000;
    }

    upstream web_upstream {
        server web:3000;
    }

    # ACME HTTP-01 challenge + redirect everything else to HTTPS. Point
    # PUBLIC_DOMAIN's DNS at this server before relying on the redirect —
    # see docs/DEPLOYMENT.md.
    server {
        listen 80;
        server_name yonixalpha.com www.yonixalpha.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # The cert/key paths below always exist by the time nginx reads this
    # file — docker-entrypoint.sh writes a temporary self-signed pair here
    # on first boot if certbot hasn't run yet (see docs/DEPLOYMENT.md's TLS
    # bootstrap section), so this block is live from the very first
    # `docker compose up`, not something enabled later by hand.
    server {
        listen 443 ssl;
        server_name yonixalpha.com www.yonixalpha.com;

        ssl_certificate     /etc/letsencrypt/live/yonixalpha.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yonixalpha.com/privkey.pem;

        # Sent on every response, HTTPS and errors included, so a
        # misconfigured upstream can't silently drop them. HSTS is safe to
        # set unconditionally here since port 80 only ever redirects to
        # https:// (see the ACME server block above) — there is no plain-HTTP
        # content on this domain to accidentally lock users out of.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # connect-src includes the wss:// scheme for the dashboard's
        # WebSocket subscriptions (see NEXT_PUBLIC_WS_URL); frame-ancestors
        # duplicates X-Frame-Options for browsers that only honor CSP.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
