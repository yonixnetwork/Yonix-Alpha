events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    upstream api_upstream {
        server api:8000;
    }

    upstream web_upstream {
        server web:3000;
    }

    # ACME HTTP-01 challenge + redirect to HTTPS. Point PUBLIC_DOMAIN's DNS
    # at this server, then provision certs (see docs/DEPLOYMENT.md) before
    # enabling the HTTPS server block below.
    server {
        listen 80;
        server_name yonixalpha.com www.yonixalpha.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

