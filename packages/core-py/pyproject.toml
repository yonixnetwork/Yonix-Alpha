[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yonixalpha-core"
version = "0.1.0"
description = "Shared config, logging, security, database models, and Solana RPC/WS transport for all YonixAlpha Python services."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "pyjwt==2.14.0",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==23.1.0",
    "structlog==24.4.0",
    "httpx==0.28.1",
    "websockets==14.1",
    # Keypairs, PDAs and versioned transactions for PumpSwap pool derivation
    # and local signing of live orders.
    "solders==0.29.0",
    # Encrypts dashboard-managed provider URLs (they embed API keys) at rest.
    "cryptography==50.0.1",
    # EVM chains (BSC, Robinhood Chain): ABI encoding / log decoding and
    # server-side transaction signing.
    "eth-abi==5.2.0",
    "eth-account==0.13.7",
]

[project.optional-dependencies]
# Only decision-engine (inference) and services/ml (training) need this —
# an extra rather than a base dependency so every other service's image
# (data-solana, the three Solana engines, engine-binance-futures) doesn't
# pull in numpy/scikit-learn for no reason.
ml = [
    "numpy==2.1.3",
    "scikit-learn==1.5.2",
    "joblib==1.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["yonixalpha_core"]
