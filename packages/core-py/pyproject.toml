[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yonixalpha-core"
version = "0.1.0"
description = "Shared config, logging, security, and database models for all YonixAlpha Python services."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "pyjwt==2.10.1",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==23.1.0",
    "structlog==24.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["yonixalpha_core"]
